<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in - Aulas de Vôlei</title>
    <!-- Tailwind CSS para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <div class="max-w-xl mx-auto p-6">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-blue-600">🏐 Check-in Vôlei</h1>
            <p class="text-slate-500">Faça seu check-in na aula de forma rápida</p>
        </header>

        <!-- Identificação do Aluno -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-6">
            <label class="block text-sm font-medium text-slate-700 mb-1">Seu Nome (para check-in):</label>
            <input type="text" id="nome-aluno" placeholder="Digite seu nome completo" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <!-- Lista de Aulas -->
        <h2 class="text-xl font-semibold mb-4">Aulas Disponíveis</h2>
        <div id="lista-aulas" class="space-y-4">
            <p class="text-slate-500 text-center">Carregando aulas...</p>
        </div>
    </div>

    <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Seu script principal -->
    <script src="app.js"></script>
</body>
</html>
